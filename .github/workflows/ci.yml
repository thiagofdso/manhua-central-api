name: CI — Backend Core API Gateway (Go)

on:
  push:
    branches:
      - main
      - desenv
  pull_request:
    branches:
      - main
      - desenv

jobs:
  test-and-build:
    name: Go Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: go.sum

      - name: Download Dependencies
        run: go mod download

      - name: Run Tests (Race Detector)
        run: go test -v -race ./...

      - name: Build Binary
        run: CGO_ENABLED=0 go build -v -o /tmp/manhua-api ./cmd/server
